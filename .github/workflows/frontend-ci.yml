# ============================================
# 前端 CI：typecheck → build
# ============================================
# 与 backend-ci 镜像：只跑前端的类型检查 + 生产构建（不跑 test，因为
# 前端还没有单元测试约定，后期加时再补 vitest 步骤）。
# 触发条件：所有 push 和 PR（聚焦 client/ 目录变化）

name: frontend-ci

on:
  # ★ 不限路径：README、.gitignore、docs/ 改了也跑（避免 paths 过滤导致 CI 静默跳过）
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck → build
    runs-on: ubuntu-latest

    defaults:
      run:
        # ★ monorepo 风格：所有命令在 client/ 子目录跑
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        # ★ vue-tsc 在 build 前抓所有 .vue 类型错误（template 内表达式也查）
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7
          if-no-files-found: ignore
